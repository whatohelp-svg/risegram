name: RiseGram Web beta build
on:
  push:
    branches: [risegram/platform-portal]
    paths: ['web-client/**', '.github/workflows/web-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iamxvbaba/gramsrv-telegram-tt
          ref: 003316a04a173983d1df8f0fb9d8113708a1c582
          path: web-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 web-client/configure.py web-upstream
      - name: Build full Web A client
        working-directory: web-upstream
        env:
          APP_NAME: RiseGram
          APP_TITLE: RiseGram
          BASE_URL: https://whatohelp-svg.github.io/risegram/web/
          TELESRV_WEB_DC_HOST: risegram-risegram.up.railway.app
          TELESRV_WEB_DC_PORT: '443'
          TELEGRAM_API_ID: ${{ vars.RISEGRAM_WEB_API_ID }}
          TELEGRAM_API_HASH: ${{ vars.RISEGRAM_WEB_API_HASH }}
        run: |
          set -euo pipefail
          # The private RiseGram MTProto server uses the API ID as client
          # metadata, not a Telegram account credential. These placeholders
          # are for an unpublished experimental artifact only.
          if [ -z "$TELEGRAM_API_ID" ] && [ -z "$TELEGRAM_API_HASH" ]; then
            export TELEGRAM_API_ID=100000
            export TELEGRAM_API_HASH=00000000000000000000000000000000
            echo "::notice::Using isolated RiseGram beta client identifiers; do not publish until authentication is verified."
          fi
          [[ "$TELEGRAM_API_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TELEGRAM_API_HASH" =~ ^[a-fA-F0-9]{32}$ ]]
          npm ci
          npm run build:production
      - uses: actions/upload-artifact@v4
        with:
          name: RiseGram-Web-experimental
          path: web-upstream/dist/
          if-no-files-found: error
